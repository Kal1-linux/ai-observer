version: '3.8'

services:
  ai-observer:
    build: .
    container_name: ai-observer
    hostname: ai-observer
    volumes:
      - ./sessions:/home/aiuser/.ai-observer/casts
      - ~/.ssh:/home/aiuser/.ssh:ro  # Mount SSH keys for mempalace access
    environment:
      - MEMPALACE_SERVER=${MEMPALACE_SERVER:-192.168.1.137}
      - USERNAME=aiuser
    stdin_open: true
    tty: true
    restart: unless-stopped
    network_mode: host  # Allow SSH to external server

volumes:
  sessions:
